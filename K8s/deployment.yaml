apiVersion: apps/v1
kind: Deployment

metadata:
  name: crewmeister-app

spec:
  replicas: 1

  selector:
    matchLabels:
      app: crewmeister-app

  template:
    metadata:
      labels:
        app: crewmeister-app

    spec:
      containers:
        - name: crewmeister-app
          image: devops-coding-challenge-app:latest

          ports:
            - containerPort: 8080

          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:mysql://mysql:3306/challenge?createDatabaseIfNotExist=true

            - name: SPRING_DATASOURCE_USERNAME
              value: root

            - name: SPRING_DATASOURCE_PASSWORD
              value: dev
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5              